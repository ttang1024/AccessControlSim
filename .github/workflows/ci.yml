name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run already in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Pinned so CI and local formatting always agree.
      - run: pip install clang-format==21.1.2
      - name: Check formatting
        run: |
          find src tests \( -name '*.h' -o -name '*.cpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux GCC 13",   os: ubuntu-24.04, cc: gcc-13,   cxx: g++-13 }
          - { name: "Linux Clang 18", os: ubuntu-24.04, cc: clang-18, cxx: clang++-18 }
          - { name: "macOS Clang",    os: macos-15,     cc: clang,    cxx: clang++ }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build (warnings are errors)
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "ASan + UBSan", flag: ACS_ENABLE_SANITIZERS }
          - { name: "TSan",         flag: ACS_ENABLE_TSAN }
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      # Ubuntu 24.04's high ASLR entropy breaks the sanitizer runtimes'
      # fixed memory layout ("unexpected memory mapping"). Reduce it.
      - name: Adjust ASLR for sanitizers
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -D${{ matrix.flag }}=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
